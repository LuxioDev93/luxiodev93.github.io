<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copiar Prompt</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            max-width: 600px;
            width: 100%;
        }
        pre {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 16px;
            border-radius: 8px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .mensaje {
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
            color: #16a34a;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .mensaje.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <pre id="textoPrompt"Genera un archivo JavaScript con preguntas de opción múltiple para una app de aprendizaje.Formato obligatorio:
window.QUIZ_QUESTIONS = [
    { question: '...', correct: '...', wrong1: '...', wrong2: '...', learned: false },
    ...
];Reglas:Propiedad learned SIEMPRE en false
Preguntas cerradas con respuesta única
correct = respuesta correcta, wrong1/wrong2 = incorrectas plausibles
Sin caracteres especiales que rompan el JS (escapar comillas simples con \')
preguntas necesarias para considerar que el usuario sabe del tema no menos de 10
Devuelve SOLO el código JavaScript sin explicaciones

Tema a convertir: 

</pre>
        
        <button onclick="copiarTexto()">Copiar al portapapeles</button>
        <div id="mensaje" class="mensaje">¡Texto copiado con éxito!</div>
    </div>

    <script>
        function copiarTexto() {
            const texto = document.getElementById("textoPrompt").innerText;
            navigator.clipboard.writeText(texto).then(() => {
                const mensaje = document.getElementById("mensaje");
                mensaje.classList.add("show");
                setTimeout(() => {
                    mensaje.classList.remove("show");
                }, 2000);
            }).catch(err => {
                console.error("Error al copiar: ", err);
            });
        }
    </script>

</body>
</html>
