<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Animales - Pantalla Completa</title>
  <style>
    :root {
      --bg-color: #1a1a1a;
      --card-bg: #ffffff;
      --text-main: #111111;
      --text-muted: #222222;
      --accent-color: #0056b3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      /* Margen exacto: 5% arriba/abajo, 1% a los lados */
      padding: 5vh 1vw;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Contenedor que ocupa casi la totalidad de la pantalla disponible */
    .app-container {
      width: 98vw;
      height: 90vh;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 2.5vh 2vw;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 1. Buscador Superior */
    .search-box {
      position: relative;
      margin-bottom: 2vh;
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 1.5vh 1.5vw;
      /* La fuente escala dinámicamente según el ancho del monitor */
      font-size: clamp(1.2rem, 1.8vw, 2.2rem);
      font-weight: bold;
      border: 3px solid var(--accent-color);
      border-radius: 8px;
      outline: none;
      background-color: #f8f9fa;
      color: #000;
    }

    .suggestions-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border: 3px solid var(--accent-color);
      border-top: none;
      border-radius: 0 0 8px 8px;
      max-height: 35vh;
      overflow-y: auto;
      z-index: 100;
      display: none;
    }

    .suggestion-item {
      padding: 1.5vh 1.5vw;
      font-size: clamp(1rem, 1.5vw, 1.8rem);
      cursor: pointer;
      border-bottom: 1px solid #ddd;
      color: #000;
    }

    .suggestion-item:hover {
      background-color: var(--accent-color);
      color: white;
      font-weight: bold;
    }

    /* 2. Pantalla principal que llena el alto restante */
    .screen {
      flex: 1;
      display: flex;
      flex-direction: row;
      gap: 2vw;
      align-items: stretch;
      overflow: hidden;
    }

    .animal-image {
      width: 35%;
      max-width: 400px;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid #ccc;
      flex-shrink: 0;
      display: none;
    }

    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    /* Fuentes gigantes que escalan para llenar espacio */
    .animal-title {
      font-size: clamp(2rem, 3.5vw, 4.5rem);
      margin: 0 0 1.5vh 0;
      color: var(--text-main);
      text-transform: capitalize;
      line-height: 1.1;
      border-bottom: 4px solid var(--accent-color);
      padding-bottom: 0.5vh;
    }

    .animal-description {
      font-size: clamp(1.2rem, 2vw, 2.5rem); /* Ocupa y llena bien el espacio */
      color: var(--text-muted);
      line-height: 1.5;
      margin: 0;
      overflow-y: auto;
      flex: 1;
      padding-right: 1vw;
    }

    /* Estado Inicial */
    .initial-state {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .placeholder-text {
      font-size: clamp(1.4rem, 2.2vw, 3rem);
      color: #333;
      text-align: center;
      width: 100%;
      margin-bottom: 4vh;
      font-weight: bold;
    }

    /* Galería de 3 Sugerencias */
    .random-suggestions {
      display: flex;
      justify-content: center;
      gap: 3vw;
      width: 100%;
    }

    .suggestion-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .suggestion-card:hover {
      transform: scale(1.05);
    }

    .suggestion-card img {
      width: clamp(120px, 15vw, 250px);
      height: clamp(120px, 15vw, 250px);
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid #888;
      filter: grayscale(100%);
      opacity: 0.1; /* 10% opacidad */
      transition: opacity 0.3s ease, filter 0.3s ease;
    }

    .suggestion-card:hover img {
      filter: grayscale(0%);
      opacity: 1;
    }

    .suggestion-card span {
      margin-top: 1vh;
      font-size: clamp(1rem, 1.5vw, 1.8rem);
      font-weight: bold;
      color: #555;
      text-transform: capitalize;
    }

    .suggestion-card:hover span {
      color: var(--accent-color);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Buscador Superior -->
    <div class="search-box">
      <input type="text" id="search-input" class="search-input" placeholder="🔍 Escribe un animal (ej. León, Águila)..." autocomplete="off">
      <div id="suggestions" class="suggestions-list"></div>
    </div>

    <!-- Pantalla de Datos -->
    <div class="screen" id="screen">
      <div id="initial-state" class="initial-state">
        <p id="placeholder" class="placeholder-text">Escribe el nombre de un animal en el buscador para ver la información.</p>
        
        <!-- Galería de 3 Sugerencias Aleatorias B/N -->
        <div id="random-suggestions" class="random-suggestions"></div>
      </div>
      
      <img id="animal-img" class="animal-image" src="" alt="Imagen del animal">
      
      <div class="content-area" id="content-area" style="display: none;">
        <h1 id="animal-title" class="animal-title"></h1>
        <p id="animal-desc" class="animal-description"></p>
      </div>
    </div>
  </div>

  <script>
    const searchInput = document.getElementById('search-input');
    const suggestionsBox = document.getElementById('suggestions');
    const initialState = document.getElementById('initial-state');
    const placeholder = document.getElementById('placeholder');
    const randomSuggestionsContainer = document.getElementById('random-suggestions');
    const animalImg = document.getElementById('animal-img');
    const contentArea = document.getElementById('content-area');
    const animalTitle = document.getElementById('animal-title');
    const animalDesc = document.getElementById('animal-desc');

    const ANIMAL_POOL = [
      'León', 'Elefante', 'Oso panda', 'Tigre', 'Águila', 
      'Delfín', 'Lobo', 'Jirafa', 'Canguro', 'Pingüino', 
      'Guepardo', 'Cebra', 'Zorro', 'Búho', 'Gorila'
    ];

    const BAD_WORDS = ['juego', 'película', 'novela', 'suicidio', 'desambiguación', 'reto', 'álbum', 'canción', 'videojuego'];
    let debounceTimer;

    window.addEventListener('DOMContentLoaded', loadRandomSuggestions);

    async function loadRandomSuggestions() {
      randomSuggestionsContainer.innerHTML = '';
      const shuffled = [...ANIMAL_POOL].sort(() => 0.5 - Math.random());
      const selected = shuffled.slice(0, 3);

      for (const animalName of selected) {
        const card = document.createElement('div');
        card.className = 'suggestion-card';

        const img = document.createElement('img');
        img.alt = animalName;
        img.src = 'https://via.placeholder.com/200?text=...';

        const span = document.createElement('span');
        span.textContent = animalName;

        card.appendChild(img);
        card.appendChild(span);

        card.addEventListener('click', () => {
          searchInput.value = animalName;
          loadAnimalCard(animalName);
        });

        randomSuggestionsContainer.appendChild(card);

        try {
          const res = await fetch(`https://es.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(animalName)}`);
          const data = await res.json();
          if (data.thumbnail && data.thumbnail.source) {
            img.src = data.thumbnail.source;
          }
        } catch (e) {
          img.src = 'https://via.placeholder.com/200?text=Sin+Imagen';
        }
      }
    }

    searchInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      const query = searchInput.value.trim();

      if (query.length < 2) {
        suggestionsBox.style.display = 'none';
        return;
      }

      debounceTimer = setTimeout(() => {
        fetchSuggestions(query);
      }, 300);
    });

    async function fetchSuggestions(query) {
      const url = `https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(query)}&language=es&format=json&origin=*&type=item`;

      try {
        const response = await fetch(url);
        const data = await response.json();
        
        const filteredResults = data.search.filter(item => {
          const desc = (item.description || '').toLowerCase();
          const label = (item.label || '').toLowerCase();
          return !BAD_WORDS.some(word => desc.includes(word) || label.includes(word));
        }).map(item => item.label);

        showSuggestions([...new Set(filteredResults)]);
      } catch (error) {
        console.error('Error al buscar sugerencias:', error);
      }
    }

    function showSuggestions(list) {
      suggestionsBox.innerHTML = '';

      if (list.length === 0) {
        suggestionsBox.style.display = 'none';
        return;
      }

      list.forEach(item => {
        const div = document.createElement('div');
        div.className = 'suggestion-item';
        div.textContent = item;
        div.addEventListener('click', () => {
          searchInput.value = item;
          suggestionsBox.style.display = 'none';
          loadAnimalCard(item);
        });
        suggestionsBox.appendChild(div);
      });

      suggestionsBox.style.display = 'block';
    }

    async function loadAnimalCard(animalName) {
      initialState.style.display = 'flex';
      placeholder.textContent = 'Cargando datos del animal...';
      randomSuggestionsContainer.style.display = 'none';
      animalImg.style.display = 'none';
      contentArea.style.display = 'none';
      animalTitle.textContent = '';
      animalDesc.textContent = '';

      const url = `https://es.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(animalName)}`;

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('Animal no encontrado');
        
        const data = await response.json();
        const extract = (data.extract || '').toLowerCase();

        if (BAD_WORDS.some(word => extract.includes(word)) || data.type === 'disambiguation') {
          placeholder.textContent = '⚠️ El término ingresado no parece ser un animal válido.';
          randomSuggestionsContainer.style.display = 'flex';
          return;
        }

        initialState.style.display = 'none';
        contentArea.style.display = 'flex';
        animalTitle.textContent = data.title;
        animalDesc.textContent = data.extract || 'Sin descripción disponible para este animal.';

        if (data.thumbnail && data.thumbnail.source) {
          animalImg.src = data.thumbnail.source;
          animalImg.style.display = 'block';
        } else {
          animalImg.src = 'https://via.placeholder.com/300?text=Sin+Imagen';
          animalImg.style.display = 'block';
        }

      } catch (error) {
        placeholder.textContent = '❌ No se encontraron datos para este animal.';
        randomSuggestionsContainer.style.display = 'flex';
      }
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-box')) {
        suggestionsBox.style.display = 'none';
      }
    });
  </script>
</body>
</html>
